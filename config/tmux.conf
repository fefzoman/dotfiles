set -g status-position top
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on

set -g status-style "bg=default,fg=white"
setw -g window-status-style "bg=default,fg=white"
setw -g window-status-current-style "bg=default,fg=cyan"
set -g message-style "bg=default,fg=white"
set -g status-right ""

bind-key -r Left  select-pane -L
bind-key -r Right select-pane -R
bind-key -r Up    select-pane -U
bind-key -r Down  select-pane -D
bind-key -r C-Left  select-pane -L
bind-key -r C-Right select-pane -R
bind-key -r C-Up    select-pane -U
bind-key -r C-Down  select-pane -D

unbind-key &
bind q confirm-before -p "kill window #W? (y/n)" kill-window
bind k confirm-before -p "kill session #S? (y/n)" kill-session
