[project]
name = "smart-read"
version = "0.1.0"
description = "Hybrid code search for coding agents: BM25 + trigram + embeddings, weighted RRF, optional cross-encoder rerank"
requires-python = ">=3.11"
dependencies = ["fastembed>=0.9,<0.10", "numpy>=2"]

[project.scripts]
smart-read = "smart_read:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["smart_read.py"]
